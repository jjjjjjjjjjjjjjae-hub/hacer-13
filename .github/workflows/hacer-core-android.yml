name: HACER Core Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['core/**', 'LAC-tools/**', 'tools/**', 'tests/**', 'updates/lac/**', '.github/workflows/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: hacer-core-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Install only required SDK packages
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Audit repository and test packaging/signing tools
        run: |
          python3 -m pip install 'cryptography==44.0.3'
          python3 tools/verify_repo.py
          python3 -m unittest discover -s tests -v
      - name: Unit tests, lint, APK and source integration AAR
        run: gradle -p core --no-daemon :updater:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :hook:assembleRelease :updater:jar :updater:copyRuntimeLibs
      - name: Verify actual APK certificate
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs core/app/build/outputs/apk/debug/app-debug.apk
          sha256sum core/app/build/outputs/apk/debug/app-debug.apk > core/app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: HACER-Core-1.0.1-build
          if-no-files-found: error
          path: |
            core/app/build/outputs/apk/debug/
            LAC-tools/hook/build/outputs/aar/
            core/updater/build/libs/
            core/updater/build/runtime-libs/
            core/updater/build/reports/tests/
            core/app/build/reports/
  android-runtime:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM for disposable test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Real Android 15 menu, overlay and signed GitHub update tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: |
            gradle -p core --no-daemon :app:connectedDebugAndroidTest
            mkdir -p core/app/build/android-evidence
            adb pull /data/local/tmp/H13-Android-preview.png core/app/build/android-evidence/H13-Android-preview.png
            python3 tools/test_signature_conflict.py --sdk "$ANDROID_HOME" --apk core/app/build/outputs/apk/debug/app-debug.apk --report core/app/build/android-evidence/signature-conflict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: HACER-Android-15-tests
          path: |
            core/app/build/reports/androidTests/
            core/app/build/outputs/androidTest-results/
            core/app/build/android-evidence/
            core/app/build/outputs/apk/debug/
