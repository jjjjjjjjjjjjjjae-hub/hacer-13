name: HACER Core Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - '.github/workflows/hacer-core-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: core
        run: gradle --no-daemon assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: HACER-Core-1.0-debug
          path: core/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
