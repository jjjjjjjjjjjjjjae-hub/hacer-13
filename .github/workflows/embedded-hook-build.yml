name: Compile embedded HACER menu (no game files)
on:
  push:
    paths:
      - 'LAC-tools/**'
      - '.github/workflows/embedded-hook-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile menu as AAR
        working-directory: LAC-tools
        run: gradle --no-daemon :hook:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: HACER13-Embedded-Hook-AAR
          path: LAC-tools/hook/build/outputs/aar/hook-release.aar
