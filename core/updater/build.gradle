plugins { id 'java-library' }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
dependencies {
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    compileOnly 'org.json:json:20240303'
    testImplementation 'org.json:json:20240303'
    testImplementation 'junit:junit:4.13.2'
}
test { testLogging { events 'passed', 'failed', 'skipped' } }
tasks.register('copyRuntimeLibs', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('runtime-libs')
}
tasks.register('verifyCrypto') {
    doLast {
        def jar = configurations.runtimeClasspath.files.find { it.name == 'bcprov-jdk15to18-1.86.jar' }
        if (jar == null) throw new GradleException('Missing pinned BC dependency')
        def actual = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
        if (actual != 'fc50334d4d87b4272e72fa95ca748ead05bdef02ef760a5b13f64ffee317cd81') throw new GradleException('BC build dependency checksum mismatch')
    }
}
tasks.named('test') { dependsOn 'verifyCrypto' }
tasks.named('jar') { dependsOn 'verifyCrypto' }
